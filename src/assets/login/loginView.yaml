# Optional named style overrides used by style fields above.
styles:
  # Styles used by RAS accordion content.
  marginLeft30px:
    marginLeft: '30px'

  # Styles used by the Help section content.
  contactButton:
    marginTop: '40px'
  needHelpSection:
    marginTop: '40px'
  problemParagraph:
    textAlign: 'center'
    color: '#8BEAFB'
    fontSize: 18
    fontFamily: 'Nunito'
    fontWeight: '600'
    textTransform: 'uppercase'
    lineHeight: '19.17px'
    letterSpacing: '0.90px'
  centerParagraph:
    textAlign: 'center'
    marginTop: '20px'
  needHelpLink:
    color: "white"
    fontWeight: '600'
    textDecoration: underline
  whiteExternalIcon:
    color: white
